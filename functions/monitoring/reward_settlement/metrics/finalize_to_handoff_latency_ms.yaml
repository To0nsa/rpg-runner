description: Milliseconds from durable replay finalize to durable settlement handoff for accepted runs.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="replay-validator"
  jsonPayload.event="replay_validator.dispatch"
  jsonPayload.phase="settlement_handoff"
  jsonPayload.status="accepted"
metricDescriptor:
