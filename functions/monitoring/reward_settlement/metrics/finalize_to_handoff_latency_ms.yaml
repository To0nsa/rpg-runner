description: Milliseconds from durable replay finalize to durable settlement handoff for accepted runs.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="replay-validator"
  jsonPayload.event="replay_validator.dispatch"
  jsonPayload.phase="settlement_handoff"
  jsonPayload.status="accepted"
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "ms"
valueExtractor: EXTRACT(jsonPayload.durationMs)
bucketOptions:
  linearBuckets:
    # 1.5-second buckets through five minutes keep low-volume percentile
    # estimates close to an observed validator handoff within the API limit.
    numFiniteBuckets: 200
    width: 1500
    offset: 0
