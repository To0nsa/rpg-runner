name: Release preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "test_driver/**"
      - "web/**"
      - "android/**"
      - "assets/**"
      - "packages/**"
      - "functions/**"
      - "services/replay_validator/**"
      - "tool/**"
      - "tools/release/**"
      - "pubspec.*"
      - "analysis_options.yaml"
      - "pnpm-*.yaml"
      - "package.json"
      - "firebase*.json"
      - "firestore.*"
      - ".github/workflows/release-preparation.yml"
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "test/**"
      - "test_driver/**"
      - "web/**"
      - "android/**"
      - "assets/**"
      - "packages/**"
      - "functions/**"
      - "services/replay_validator/**"
      - "tool/**"
      - "tools/release/**"
      - "pubspec.*"
      - "analysis_options.yaml"
      - "pnpm-*.yaml"
      - "package.json"
      - "firebase*.json"
      - "firestore.*"
      - ".github/workflows/release-preparation.yml"

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Exercise browser startup and local gameplay
        run: >-
          flutter test --no-pub --platform chrome
          test/ui/state/platform_replay_adapters_browser_test.dart
          test/ui/bootstrap/web_practice_startup_test.dart

  component:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: functions-checks, shard: 0, count: 1, label: functions-checks}
          - {component: functions-build, shard: 0, count: 1, label: functions-build}
          - {component: client-build, shard: 0, count: 1, label: client-build}
          - {component: client-checks, shard: 0, count: 4, label: client-checks-0}
          - {component: client-checks, shard: 1, count: 4, label: client-checks-1}
          - {component: client-checks, shard: 2, count: 4, label: client-checks-2}
          - {component: client-checks, shard: 3, count: 4, label: client-checks-3}
          - {component: core-checks, shard: 0, count: 1, label: core-checks}
          - {component: protocol-checks, shard: 0, count: 1, label: protocol-checks}
          - {component: content-checks, shard: 0, count: 1, label: content-checks}
          - {component: terrain-checks, shard: 0, count: 1, label: terrain-checks}
          - {component: validator-checks, shard: 0, count: 1, label: validator-checks}
          - {component: content-freshness, shard: 0, count: 1, label: content-freshness}
    steps:
      - name: Keep checkout bytes portable
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Enable pinned package manager
        shell: pwsh
        run: corepack enable
      - uses: actions/setup-java@v4
        if: startsWith(matrix.component, 'functions-')
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        if: "!startsWith(matrix.component, 'functions-') && matrix.component != 'validator-checks'"
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - uses: dart-lang/setup-dart@v1.8.0
        if: matrix.component == 'validator-checks'
        with:
          sdk: "3.13.1"
      - name: Resolve frozen dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release/release_support.ps1
          $component = '${{ matrix.component }}'
          if ($component.StartsWith('functions-')) {
            Invoke-ReleaseCommand corepack @('pnpm','install','--frozen-lockfile') $PWD | Write-Host
            Invoke-ReleaseCommand corepack @('pnpm','--dir','functions','audit','--prod') $PWD | Write-Host
          } elseif ($component -eq 'validator-checks') {
            Invoke-ReleaseCommand dart @('pub','get','--enforce-lockfile') (Join-Path $PWD 'services/replay_validator') | Write-Host
          } else {
            Invoke-ReleaseCommand flutter @('pub','get','--enforce-lockfile') $PWD | Write-Host
            if ($component -eq 'client-checks') {
              Invoke-ReleaseCommand dart @('pub','get','--enforce-lockfile') (Join-Path $PWD 'services/replay_validator') | Write-Host
            }
          }
      - name: Compute component cache key
        id: inputs
        shell: pwsh
        run: |
          . ./tools/release/release_support.ps1
          . ./tools/release/release_cache.ps1
          . ./tools/release/prepare_release.ps1
          $component = '${{ matrix.component }}'
          $inputs = Get-ReleaseComponentInputs $PWD $component
          $chain = Get-ReleaseToolchain $PWD (Get-ReleaseComponentFamily $component)
          $key = Get-ReleaseComponentKey $inputs $chain
          "key=$key" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: matrix.component != 'client-checks'
        with:
          path: .tmp/ci-component
          key: release-v1-${{ matrix.component }}-${{ steps.inputs.outputs.key }}
      - name: Validate or reuse component
        shell: pwsh
        run: >-
          ./tools/release/validate_release.ps1
          -Component '${{ matrix.component }}'
          -CacheDirectory .tmp/ci-component
          -ShardIndex ${{ matrix.shard }}
          -ShardCount ${{ matrix.count }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: .tmp/ci-component
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.label }}
          path: .tmp/ci-logs
          if-no-files-found: ignore
          retention-days: 14

  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep checkout bytes portable
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Build and inspect development Android artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEBUG = ''
          . ./tools/release/release_support.ps1
          . ./tools/release/release_cache.ps1
          . ./tools/release/release_environments.ps1
          . ./tools/release/android_artifacts.ps1
          $root = $PWD.Path
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          Invoke-ReleaseCommand $sdkManager @('build-tools;36.0.0','platforms;android-36') $root | Write-Host
          $evidence = Join-Path $root '.tmp/ci-android'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Invoke-ReleaseCommand flutter @('pub','get','--enforce-lockfile') $root | Write-Host
          Invoke-ReleaseCommand dart @('run','packages/runner_core/tool/prepare_navigation.dart','--client') $root | Write-Host
          $inputDigest = Get-ReleaseComponentInputs $root 'android-build'
          Invoke-ReleaseCommand flutter @('build','apk','--flavor','dev','--release','--build-number=1') $root (Join-Path $evidence 'build.log') | Write-Host
          if ((Get-ReleaseComponentInputs $root 'android-build') -ne $inputDigest) { throw 'Android source/lockfile changed during CI build.' }
          $definition = Get-ReleaseEnvironmentDefinition $root dev
          $inspection = Test-AndroidArtifact $root $definition dev (Join-Path $root 'build/app/outputs/flutter-apk/app-dev-release.apk') 1 $evidence
          @{sourceCommit='${{ github.sha }}';inputDigest=(Get-ReleaseComponentInputs $root 'android-build');flutter=(Get-ReleaseToolchain $root flutter);inspection=$inspection} |
            ConvertTo-Json -Depth 12 | Set-Content (Join-Path $evidence 'android-ci.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: .tmp/ci-android
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [component, browser, android]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: .tmp/ci-downloads
      - name: Verify complete coverage and assemble release bundle
        shell: pwsh
        run: |
          . ./tools/release/release_support.ps1
          . ./tools/release/release_cache.ps1
          . ./tools/release/release_ci.ps1
          Merge-ReleaseCIBundle (Join-Path $PWD '.tmp/ci-downloads') (Join-Path $PWD '.tmp/ci-bundle') '${{ github.sha }}' ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: .tmp/ci-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
