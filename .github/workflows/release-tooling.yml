name: Release tooling

on:
  pull_request:
    paths:
      - ".github/workflows/release-tooling.yml"
      - "tools/release/**"
      - "functions/src/index.ts"
      - "functions/src/runs/compatibility.ts"
      - "functions/src/boards/provisioning.ts"
      - "lib/ui/state/app/app_state.dart"
      - "services/replay_validator/lib/src/validator_worker.dart"
      - "firebase*.json"
      - ".firebaserc"
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-tooling.yml"
      - "tools/release/**"
      - "functions/src/index.ts"
      - "functions/src/runs/compatibility.ts"
      - "functions/src/boards/provisioning.ts"
      - "lib/ui/state/app/app_state.dart"
      - "services/replay_validator/lib/src/validator_worker.dart"
      - "firebase*.json"
      - ".firebaserc"

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check helpers and mocked deployment sequence
        shell: pwsh
        run: |
          .\tools\release\test_release.ps1
          .\tools\release\test_release_integration.ps1
          .\tools\release\test_release_integration.ps1 -TestEnvironment staging
          .\tools\release\test_release_integration.ps1 -TestEnvironment prod
          .\tools\release\test_release_cache.ps1
          .\tools\release\test_release_environments.ps1
          .\tools\release\test_provision_environment.ps1
          .\tools\release\test_android_signing.ps1
          .\tools\release\test_android_artifacts.ps1
          .\tools\release\test_database_recovery.ps1
          .\tools\release\test_release_lock.ps1
          .\tools\release\test_monitoring_environment.ps1
      - name: Resolve offline release plan
        shell: pwsh
        run: .\tools\release\release.ps1 -Action Plan

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check helpers and mocked deployment sequence
        shell: powershell
        run: |
          .\tools\release\test_release.ps1
          .\tools\release\test_release_integration.ps1
          .\tools\release\test_release_integration.ps1 -TestEnvironment staging
          .\tools\release\test_release_integration.ps1 -TestEnvironment prod
          .\tools\release\test_release_cache.ps1
          .\tools\release\test_release_environments.ps1
          .\tools\release\test_provision_environment.ps1
          .\tools\release\test_android_signing.ps1
          .\tools\release\test_android_artifacts.ps1
          .\tools\release\test_database_recovery.ps1
          .\tools\release\test_release_lock.ps1
          .\tools\release\test_monitoring_environment.ps1
      - name: Resolve offline release plan
        shell: powershell
        run: .\tools\release\release.ps1 -Action Plan
