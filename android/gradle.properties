# Keep release R8 builds within the operator/CI memory budget. The former 8G
# heap plus 4G metaspace exhausted native memory on the 16 GB release machine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# AGP 9's built-in Kotlin support replaces the legacy Kotlin Android plugin.
android.builtInKotlin=true
# Flutter plugins still use the compatibility DSL while the ecosystem migrates.
android.newDsl=false
