description: Projection reconciliation observed at least 80 retained leaderboard boards.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="runprojectionreconciliation"
  jsonPayload.message="runProjectionReconciliation"
  jsonPayload.retainedBoardCount>=80
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
