description: Exact retained leaderboard-board count observed by hourly projection reconciliation.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="runprojectionreconciliation"
  jsonPayload.message="runProjectionReconciliation"
  jsonPayload.retainedBoardCount>=0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
valueExtractor: EXTRACT(jsonPayload.retainedBoardCount)
bucketOptions:
  linearBuckets:
    numFiniteBuckets: 128
    width: 1
    offset: 0
