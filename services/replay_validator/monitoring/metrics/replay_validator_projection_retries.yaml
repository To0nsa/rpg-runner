description: Leaderboard or ghost projection work returned a retryable result.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="replay-validator"
  jsonPayload.event="replay_validator.dispatch"
  jsonPayload.status="retryScheduled"
  (jsonPayload.phase="projection_retry" OR jsonPayload.phase="projection_reconciliation_retry")
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
