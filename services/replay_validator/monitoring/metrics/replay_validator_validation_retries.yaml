description: Replay validation returned a retryable lease, internal, or incident result.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="replay-validator"
  jsonPayload.event="replay_validator.dispatch"
  jsonPayload.status="retryScheduled"
  (jsonPayload.phase="lease" OR jsonPayload.phase="lease_conflict" OR jsonPayload.phase="retry" OR jsonPayload.phase="internal_error_grace" OR jsonPayload.phase="incident_mode_pause")
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
