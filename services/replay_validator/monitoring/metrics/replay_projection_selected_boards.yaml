description: Number of board reconciliation tasks selected by one scheduled invocation.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="runprojectionreconciliation"
  jsonPayload.message="runProjectionReconciliation"
  jsonPayload.selectedCount>=0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
valueExtractor: EXTRACT(jsonPayload.selectedCount)
bucketOptions:
  linearBuckets:
    numFiniteBuckets: 65
    width: 1
    offset: 0
