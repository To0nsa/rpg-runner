description: End-to-end validator projection or board-reconciliation duration in milliseconds.
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="replay-validator"
  jsonPayload.event="replay_validator.dispatch"
  jsonPayload.phase=~"^projection(_reconciliation)?_"
  jsonPayload.durationMs>=0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "ms"
valueExtractor: EXTRACT(jsonPayload.durationMs)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 2
    scale: 100
