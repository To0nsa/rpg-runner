# Validates/reuses existing navigation and benchmarks the exact final image.
timeout: 7200s
substitutions:
  _NAVIGATION_CACHE_IMAGE: navigation-empty
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/replay_validator/Dockerfile
      - --build-arg
      - NAVIGATION_CACHE_IMAGE=${_NAVIGATION_CACHE_IMAGE}
      - -t
      - ${_IMAGE_URI}
      - .
  - name: gcr.io/cloud-builders/docker
    id: benchmark-release-image
    args:
      - run
      - --rm
      - --cpus=1
      - --memory=512m
      - ${_IMAGE_URI}
      - benchmark
      - --ticks=36000
      - --strict
images:
  - ${_IMAGE_URI}
