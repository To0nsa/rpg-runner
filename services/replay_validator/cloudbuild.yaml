steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/replay_validator/Dockerfile
      - -t
      - ${_IMAGE_URI}
      - .
  - name: gcr.io/cloud-builders/docker
    id: benchmark-release-image
    args:
      - run
      - --rm
      - --cpus=1
      - --memory=512m
      - ${_IMAGE_URI}
      - benchmark
      - --ticks=36000
      - --strict
images:
  - ${_IMAGE_URI}
